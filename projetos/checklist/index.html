<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Check List | Painel SPG</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="../../favicon.png">
    <link rel="apple-touch-icon" href="../../icone-app.png">
    <link rel="manifest" href="../../manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../supabase-api.js"></script>
    <script src="checklists.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        #cabecalho { position: relative; background: rgba(255,255,255,0.78); -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%); border-bottom: 1px solid rgba(226,232,240,0.9); box-shadow: 0 6px 24px -18px rgba(15,23,42,0.35); }
        #cabecalho::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; pointer-events: none; background: linear-gradient(90deg, #10b981, #14b8a6 35%, #0ea5e9 70%, #6366f1); }
        #checklistAbas { scrollbar-width: none; }
        #checklistAbas::-webkit-scrollbar { display: none; }
    </style>
    <script src="../../lista-moderna.js"></script>
    <script src="../../trava-fundo.js"></script>
    <script src="../../barra-abas.js"></script>
    <style>
        /* Celular: as abas vão para a barra flutuante, e o quadro da lista termina acima dela */
        @media (max-width: 1023px) {
            #checklistAbas { display: none; }
            #cabecalho > div:first-child { padding-bottom: .65rem; }
            body.com-barra-abas { padding-bottom: 0 !important; }
            body.com-barra-abas #checklistArea { margin-bottom: calc(88px + env(safe-area-inset-bottom)); }
            /* Dentro do Painel o topo dele já mostra "Check List" e o menu tem o Sair: sem cabeçalho repetido */
            html.no-painel #cabecalho { display: none; }
        }
    </style>
    <script>
        try { if (window.top !== window.self) document.documentElement.classList.add('no-painel'); } catch (e) { document.documentElement.classList.add('no-painel'); }
    </script>
    <style>
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-[100dvh] flex flex-col overflow-hidden">
    <header id="cabecalho" class="shrink-0 z-20">
        <div class="flex items-center gap-2.5 px-4 pt-3">
            <a id="btnMenuProjetos" href="../../index.html" title="Menu de projetos" aria-label="Menu de projetos" class="hidden w-9 h-9 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-100 ring-1 ring-slate-200/80 shrink-0"><i data-lucide="layout-grid" class="w-4 h-4"></i></a>
            <img src="../../icone-app.png" alt="" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl shadow-sm ring-1 ring-black/5 shrink-0">
            <div class="flex-1 min-w-0">
                <h1 class="text-sm sm:text-[15px] font-extrabold leading-tight tracking-tight truncate">Check List</h1>
                <p class="text-[10px] font-semibold text-slate-400 tracking-wide truncate">Veículos, embarque, limpeza e POP</p>
            </div>
        </div>
        <div id="checklistAbas" role="tablist" aria-label="Check-lists" class="flex gap-1 overflow-x-auto mx-4 my-2.5 p-1 bg-slate-100/80 rounded-2xl ring-1 ring-slate-200/70"></div>
    </header>

    <main id="checklistArea" class="relative flex-1 min-h-0 bg-slate-50">
        <div id="checklistCarregando" class="hidden absolute inset-0 z-10 flex items-center justify-center bg-white" role="status" aria-label="Carregando">
            <i data-lucide="loader-circle" class="w-7 h-7 text-emerald-600 animate-spin"></i>
        </div>
    </main>

    <script>
        lucide.createIcons();
        window.iniciarChecklists();

        // Barra flutuante no celular: mesmas abas, na mesma ordem e só as liberadas
        (function () {
            const abasTopo = document.getElementById('checklistAbas');
            const area = document.getElementById('checklistArea');
            const CURTOS = { cronograma: 'Cronograma' };
            const ICONES = { geral: 'truck', embarque: 'ship', limpeza: 'sparkles', cronograma: 'calendar-check', pop: 'clipboard-check' };
            const CORES = { geral: '2, 132, 199', embarque: '13, 148, 136', limpeza: '22, 163, 74', cronograma: '217, 119, 6', pop: '79, 70, 229' };
            const abas = () => [...abasTopo.querySelectorAll('[data-checklist]')].map(b => ({
                id: b.dataset.checklist, nome: CURTOS[b.dataset.checklist] || b.textContent.trim(),
                icone: ICONES[b.dataset.checklist] || 'clipboard-list', cor: CORES[b.dataset.checklist],
                ativa: b.getAttribute('aria-selected') === 'true'
            }));
            const barra = BarraAbas.criar({ abas, abrir: id => { const b = abasTopo.querySelector('[data-checklist="' + id + '"]'); if (b) b.click(); }, rotulo: 'Check-lists' });
            new MutationObserver(() => barra.atualizar()).observe(abasTopo, { childList: true });
            // A lista rola dentro do próprio quadro: a barra acompanha a rolagem e o teclado de lá
            const ligar = q => { try { if (q.contentWindow) barra.acompanhar(q.contentWindow); } catch (e) { /* quadro de outro endereço */ } };
            const prepararQuadro = q => { if (q.dataset.comBarra) return; q.dataset.comBarra = '1'; q.addEventListener('load', () => ligar(q)); ligar(q); };
            area.querySelectorAll('iframe').forEach(prepararQuadro);
            new MutationObserver(l => l.forEach(m => m.addedNodes.forEach(n => { if (n.tagName === 'IFRAME') prepararQuadro(n); }))).observe(area, { childList: true });
        })();
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => { navigator.serviceWorker.register('../../sw.js').catch(() => {}); });
        }
    </script>
</body>
</html>
