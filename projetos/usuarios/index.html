<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastro de Usuários e Locais | Painel SPG</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="../../icone-app.png">
    <link rel="apple-touch-icon" href="../../icone-app.png">
    <link rel="manifest" href="../../manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../supabase-api.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        #topo {
            background: rgba(255,255,255,0.78);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            backdrop-filter: blur(18px) saturate(180%);
            border-bottom: 1px solid rgba(226,232,240,0.9);
        }
        #topo::before {
            content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; pointer-events: none;
            background: linear-gradient(90deg, #10b981, #14b8a6 35%, #0ea5e9 70%, #6366f1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header id="topo" class="sticky top-0 z-30 px-4 py-2.5 flex items-center gap-3">
        <a href="../../index.html" title="Menu de projetos" aria-label="Menu de projetos" class="w-9 h-9 flex items-center justify-center rounded-xl text-slate-500 hover:bg-slate-100 ring-1 ring-slate-200/80 shrink-0"><i data-lucide="layout-grid" class="w-4 h-4"></i></a>
        <div class="min-w-0 flex-1">
            <h1 class="text-sm sm:text-[15px] font-extrabold leading-tight truncate">Cadastro de Usuários</h1>
            <p id="contagem" class="text-[10px] font-semibold text-slate-400 truncate">Quem acessa o quê</p>
        </div>
        <button type="button" data-acao="novo" class="flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white shadow-sm shrink-0"><i data-lucide="user-plus" class="w-4 h-4"></i>Novo usuário</button>
    </header>

    <main class="max-w-6xl mx-auto p-4 lg:grid lg:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)] lg:gap-6 lg:items-start">
        <section aria-label="Lista de usuários" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="flex items-stretch border-b border-slate-200">
                <div id="abasLocais" class="flex-1 min-w-0 flex gap-1 overflow-x-auto px-3 pt-2" role="group" aria-label="Filtrar por local"></div>
                <button type="button" data-acao="gerenciarLocais" title="Locais e projetos" aria-label="Locais e projetos" class="shrink-0 flex items-center gap-1.5 px-3 text-xs font-bold text-slate-500 hover:text-slate-800 border-l border-slate-200"><i data-lucide="settings-2" class="w-4 h-4"></i><span class="hidden sm:inline">Configurar</span></button>
            </div>
            <div class="p-4 space-y-3 border-b border-slate-100">
                <div id="filtros" class="flex flex-wrap gap-1.5"></div>
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="search" id="busca" placeholder="Buscar por nome ou usuário" aria-label="Buscar usuário" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl py-2 pl-9 pr-3 text-sm outline-none focus:border-slate-400 focus:bg-white">
                </div>
            </div>
            <div id="lista" class="p-3 space-y-2"></div>
        </section>

        <!-- No celular o editor abre por cima da lista; no computador fica ao lado -->
        <section id="painelEditor" aria-label="Editor de usuário" class="hidden lg:block"></section>
    </main>

    <div id="janela" role="dialog" aria-modal="true" aria-labelledby="janelaTitulo" class="hidden fixed inset-0 z-[70] items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <h2 id="janelaTitulo" class="text-lg font-black text-slate-800"></h2>
            <p id="janelaTexto" class="text-sm text-slate-600 mt-2 whitespace-pre-line"></p>
            <div class="flex gap-2 mt-5">
                <button type="button" id="janelaCancelar" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-sm">Cancelar</button>
                <button type="button" id="janelaOk" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl text-sm">OK</button>
            </div>
        </div>
    </div>

    <script src="usuarios.js"></script>
</body>
</html>
