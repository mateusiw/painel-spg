<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notificações | Painel SPG</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="../../favicon.png">
    <link rel="apple-touch-icon" href="../../icone-app.png">
    <link rel="manifest" href="../../manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../supabase-api.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        #topo {
            background: rgba(255,255,255,0.78);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            backdrop-filter: blur(18px) saturate(180%);
            border-bottom: 1px solid rgba(226,232,240,0.9);
        }
        #topo::before {
            content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; pointer-events: none;
            background: linear-gradient(90deg, #10b981, #14b8a6 35%, #0ea5e9 70%, #6366f1);
        }
        .campo { padding: .5rem .75rem; font-size: .8125rem; font-weight: 600; color: #334155; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: .75rem; outline: none; }
        .campo:focus { border-color: #16a34a; background: #fff; }
        #edCorpo::-webkit-scrollbar { width: 8px; }
        #edCorpo::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
        #edCorpo::-webkit-scrollbar-track { background: transparent; }
        #edCorpo::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 2px solid #fff; }
        @supports not selector(::-webkit-scrollbar) { #edCorpo { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; } }
        .rotulo { display: block; margin-bottom: .25rem; font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; }
    </style>
    <script src="../../lista-moderna.js"></script>
    <script src="../../trava-fundo.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <header id="topo" class="sticky top-0 z-30 px-4 py-2.5 flex items-center gap-3">
        <img src="../../icone-app.png" alt="" class="w-9 h-9 rounded-xl shadow-sm ring-1 ring-black/5 shrink-0">
        <div class="min-w-0 flex-1">
            <h1 class="text-sm sm:text-[15px] font-extrabold leading-tight truncate">Notificações</h1>
            <p class="text-[10px] font-semibold text-slate-400 tracking-wide truncate">O que cada site avisa, quando e para quem</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-5 pb-16">
        <div id="avisoGeral" role="status" aria-live="polite" class="hidden"></div>

        <p id="avisoPendencia" class="hidden bg-amber-50 text-amber-900 rounded-2xl p-4 text-sm font-semibold"></p>

        <section aria-labelledby="tituloSites">
            <h2 id="tituloSites" class="text-xs font-extrabold text-slate-500 uppercase tracking-wider mb-3">Sites</h2>
            <div id="listaSites" class="space-y-3"></div>
            <p class="text-[11px] text-slate-400 mt-3">"Com acesso" envia só para quem tem acesso ao site e ao local do aviso. Quando não há dados no dia, a notificação não é enviada. Cada pessoa ainda pode desligar o que não quiser receber.</p>
        </section>

        <section aria-labelledby="tituloAparelhos">
            <div class="flex items-center justify-between gap-3 mb-3">
                <h2 id="tituloAparelhos" class="text-xs font-extrabold text-slate-500 uppercase tracking-wider">Usuários e aparelhos</h2>
                <div id="filtroAparelhos" class="flex gap-0.5 p-0.5 bg-slate-100 rounded-xl" role="group" aria-label="Filtrar usuários"></div>
            </div>
            <p id="resumoAparelhos" class="text-xs font-semibold text-slate-500 mb-2"></p>
            <div id="listaAparelhos" class="bg-white border border-slate-200 rounded-2xl divide-y divide-slate-100 overflow-hidden"></div>
        </section>

        <section aria-labelledby="tituloEnvios">
            <h2 id="tituloEnvios" class="text-xs font-extrabold text-slate-500 uppercase tracking-wider mb-3">Últimos envios</h2>
            <div id="listaEnvios" class="bg-white border border-slate-200 rounded-2xl divide-y divide-slate-100 overflow-hidden"></div>
        </section>
    </main>

    <div id="editorAviso" class="hidden"></div>

    <script src="notificacoes.js"></script>
</body>
</html>
